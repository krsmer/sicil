[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"   # REQUIRED on Avalanche C-Chain (Pectra not supported)
optimizer = true
optimizer_runs = 200
build_info = true        # needed for Builder Hub / explorer verification

[rpc_endpoints]
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
avalanche = "https://api.avax.network/ext/bc/C/rpc"
